plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ankong.toolbox'
    compileSdk 34

    defaultConfig {
        applicationId 'com.ankong.toolbox'
        minSdk 23
        targetSdk 34
        versionCode 22
        versionName '2.7'
        // 只保留主流 ABI，覆盖 99% 真机，避免 4 种 ABI 全打导致 APK 过大
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    sourceSets {
        main {
            // v1.9：使用去掉 package 属性的 Manifest，避免与 namespace 冲突
            manifest.srcFile 'gradle-res/AndroidManifest.xml'
            assets.srcDirs = ['src/main/assets']
        }
    }
}

dependencies {
    // v1.9：ML Kit bundled 中文文字识别（on-device，模型随 APK 打包，无需联网 / GMS）
    implementation 'com.google.mlkit:text-recognition-chinese:16.0.1'
}
